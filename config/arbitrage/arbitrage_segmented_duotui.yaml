# ============================================================================
# 分段网格套利 v2 配置文件
# ============================================================================
# 系统：分段网格套利 v2（运行在套利执行终端 V3 UI）
# 支持模式：
#   - SEG-GRID  ：分段网格模式，价差扩大时逐段开仓、收敛时逐段平仓
#   - SEG-SCALP ：分段剥头皮模式，达到触发格子后锁定持仓，止盈后退出
#   - SEG-GRID+ ：分段网格拆单模式，单个网格允许多笔累积，解决深度不足
# 启动命令：
#   python main_unified.py --config config/arbitrage/arbitrage_segmented.yaml
# ============================================================================

# ============================================================================
# 1. 系统运行模式
# ============================================================================
system_mode:
  monitor_only: true               # 监控模式开关（true=只监控不下单，false=正常执行交易）
  data_freshness_seconds: 3.0       # 数据新鲜度要求（秒），只使用 N 秒内的新鲜数据

# ============================================================================
# 2. 决策配置
# ============================================================================
decision:
  deduct_fees: true                 # 是否扣除手续费后再判断价差（true=扣除手续费，false=使用原始价差）
  exchange_fee_config:              # 交易所手续费配置（可覆盖默认值）
    default:
      limit_fee_rate: 0             # Maker 手续费率（小数比例，0=0%）
      market_fee_rate: 0            # Taker 手续费率（小数比例，0=0%）
    # 可针对特定交易所覆盖：
    # lighter:
    #   limit_fee_rate: 0.0001      # 0.01%
    #   market_fee_rate: 0.0003     # 0.03%

# ============================================================================
# 4. 全局风险控制配置
# ============================================================================
risk_control:
  balance_management:
    min_balance_warning: 100.0      # 余额警告阈值（USDC），余额 < 此值时发出警告但继续运行
    min_balance_close_position: 50.0     # 余额强制平仓阈值（USDC），余额 < 此值时强制停止并平仓
    check_interval: 60              # 余额检查间隔（秒），每 N 秒检查一次余额

# ============================================================================
# 5. 全局默认配置（所有交易对的默认值）
# ============================================================================
default_config:
  # --------------------------------------------------------------------------
  # 6.1 网格配置
  # --------------------------------------------------------------------------
  grid_config:
    # --- 基础网格参数 ---
    initial_spread_threshold: 0.03  # 第 1 格触发点（百分比），价差 ≥ 此值时开始第 1 格
    grid_step: 0.03                 # 网格间隔（百分比），每格之间的价差间隔
    max_segments: 5                 # 最大格子数，风控限制最多开 N 格
    # --- 拆单配置 ---
    split_order_size: 1.0           # 单笔订单数量（等于 base_quantity=不拆单，小于=拆单执行）
    # --- 剥头皮模式配置 ---
    scalping_enabled: false          # 是否启用剥头皮模式（true=启用，false=禁用）
    scalping_trigger_segment: 5     # 剥头皮触发格子，达到第 N 格时锁定持仓等待止盈
    scalping_profit_threshold: 0.02 # 剥头皮止盈阈值（百分比），价差回落此幅度时平仓止盈
    # --- 平仓模式配置 ---
    use_symmetric_close: true       # 对称平仓模式（true=对称平仓，false=非对称平仓）
    profit_per_segment: 0.045       # 非对称模式目标收益（百分比），use_symmetric_close=false 时生效
    scalp_profit_threshold: 0.02    # 兼容旧参数（已被 scalping_profit_threshold 替代）
    # --- 持续性检查 ---
    spread_persistence_seconds: 10  # 价差持续时间要求（秒），价差必须连续满足 N 秒才触发开仓
    strict_persistence_check: true  # 严格持续性检查（true=每秒所有数据都满足，false=每秒至少1条）
    # --- 盘口深度校验 ---
    require_orderbook_liquidity: true  # 是否启用对手盘深度校验（true=检查深度，false=不检查）
    min_orderbook_quantity: 0.01     # 对手盘最小可用数量，深度必须 ≥ 此值才允许下单
    slippage_tolerance: 0.0005      # 市价单滑点（0.0005=0.05%），优先级最高，可覆盖全局默认值
    # --- 价格稳定性检查 ---
    price_stability_window_seconds: 2    # 价格稳定性窗口（秒），检查 N 秒内对手盘价格波动
    price_stability_threshold_pct: 0.005 # 价格波动阈值（0.005=0.5%），波动超过此值拒绝下单
    # --- 盘口自有点差限制 ---
    max_local_orderbook_spread_pct: 0.003  # 每个参与交易对的bid-ask点差不得超过0.3%
  
  # --------------------------------------------------------------------------
  # 6.2 数量配置
  # --------------------------------------------------------------------------
  quantity_config:
    base_quantity: 1.0              # 基础数量（每格），fixed模式=固定数量，value模式=按金额计算
    quantity_mode: "fixed"          # 数量模式（"fixed"=固定数量，"value"=按金额）
    target_value_usdc: 100.0        # 按金额模式的目标金额（USDC），quantity_mode=value 时生效
    quantity_precision: 2           # 数量精度（小数位数），下单数量会四舍五入到此精度
    min_exchange_order_qty:         # 🔧 交易所最小下单量配置（按代币，可选）
      default: 0.0                  # 0 表示不限制，按需为各交易所单独配置
  
  # --------------------------------------------------------------------------
  # 6.3 风控配置
  # --------------------------------------------------------------------------
  risk_config:
    max_position_value: 5000.0      # 最大持仓价值（USDC），持仓价值超过此值时停止开仓
    max_loss_percent: 2.0           # 最大亏损百分比（%），亏损超过此百分比时触发风控
    # --- 资金费率风控 ---
    enable_funding_rate_risk: true  # 是否启用资金费率风控（true=检查资金费率，false=不检查）
    max_unfavorable_funding_hours: 8     # 最大不利资金费率持续时间（小时）
    funding_rate_diff_threshold: 0.01    # 资金费率差异阈值（百分比），超过此值视为不利
    
  # --------------------------------------------------------------------------
  # 6.4 订单执行超时（覆盖执行器默认值）
  # --------------------------------------------------------------------------
  order_execution:
    limit_order_timeout: 5            # 限价订单等待时间（秒）
    lighter_market_order_timeout: 3    # lighter 市价单专用等待时间（秒）
    max_retry_count: 3                 # 订单重试次数（保持与执行器默认一致）

# ============================================================================
# 7. 特定交易对配置（覆盖默认值）
# ============================================================================
# 说明：未配置的字段会继承 default_config 的值，只需配置与默认值不同的参数
#       enabled: false 的交易对不会被处理
# ============================================================================
symbol_configs:
  # --------------------------------------------------------------------------
  # 7.1 PAXG 黄金套利（单腿）
  # --------------------------------------------------------------------------
  "PAXG-USD-PERP":
    enabled: false                  # 🔧 开关：true=启用，false=禁用
    grid_config:
      initial_spread_threshold: 0.05     # 第 1 格触发点：0.05%
      grid_step: 0.03                    # 网格间隔：0.03%
      max_segments: 8                    # 最大格子数：8 格
    quantity_config:
      base_quantity: 0.006               # 每格数量：0.006 PAXG
      quantity_mode: "fixed"             # 固定数量模式
      quantity_precision: 3              # 数量精度：3 位小数
      split_order_size: 0.003            # 单笔订单：0.003（拆成 2 笔）
      target_value_usdc: 200.0           # 按金额模式目标：200 USDC（当前未使用）
  
  # --------------------------------------------------------------------------
  # 7.2 XAU 黄金套利（单腿）
  # --------------------------------------------------------------------------
  "XAU-USD-PERP":
    enabled: false                  # 🔧 开关：true=启用，false=禁用
    grid_config:
      initial_spread_threshold: 0.03     # 第 1 格触发点：0.05%
      grid_step: 0.03                    # 网格间隔：0.03%
      max_segments: 10                   # 最大格子数：10 格
    quantity_config:
      base_quantity: 0.006               # 每格数量：0.006 XAU
      quantity_mode: "fixed"             # 固定数量模式
      quantity_precision: 3              # 数量精度：3 位小数
      split_order_size: 0.003            # 单笔订单：0.003（拆成 2 笔）
      target_value_usdc: 200.0           # 按金额模式目标：200 USDC（当前未使用）
  
  # --------------------------------------------------------------------------
  # 7.3 LIGHTER 同所黄金套利（PAXG ↔ XAU）
  # --------------------------------------------------------------------------
  "LIGHTER_PAXG_XAU":
    enabled: true                  # 🔧 开关：true=启用，false=禁用
    grid_config:
      initial_spread_threshold: 0.04     # 第 1 格触发点：0.03%
      grid_step: 0.04                    # 网格间隔：0.03%
      max_segments: 12                   # 最大格子数：10 格
      limit_price_offset_abs: 0.1        # 多腿双限价专用：加价/减价0.1，逼近市价成交
    quantity_config:
      base_quantity: 0.1               # 每格总数量：0.006
      quantity_mode: "fixed"             # 固定数量模式
      quantity_precision: 3              # 数量精度：3 位小数
      split_order_size: 0.05            # 单笔订单：0.003（拆成 2 笔）
      target_value_usdc: 200.0           # 按金额模式目标：200 USDC（当前未使用）
    min_exchange_order_qty:         # 🔧 交易所最小下单量配置（按代币，可选）
      default: 0.003                  # 0 表示不限制，按需为各交易所单独配置
  
  # --------------------------------------------------------------------------
  # 7.4 BTC 跨交易所套利
  # --------------------------------------------------------------------------
  "BTC-USDC-PERP":
    enabled: false                   # 🔧 开关：true=启用，false=禁用
    grid_config:
      initial_spread_threshold: 0.02     # 第 1 格触发点：0.02%
      grid_step: 0.03                    # 网格间隔：0.03%
      max_segments: 5                    # 最大格子数：5 格
          # --- 盘口深度校验 ---
    require_orderbook_liquidity: true  # 是否启用对手盘深度校验（true=检查深度，false=不检查）
    min_orderbook_quantity: 0.1     # 对手盘最小可用数量，深度必须 ≥ 此值才允许下单
    slippage_tolerance: 0.01      # 市价单最大滑点（0.0005=0.05%），超过此滑点拒绝下单
    quantity_config:
      base_quantity: 0.002              # 每格数量：0.0004 BTC
      quantity_mode: "fixed"             # 固定数量模式
      quantity_precision: 5              # 数量精度：5 位小数
      split_order_size: 0.001           # 单笔订单：0.0002（拆成 2 笔）
      target_value_usdc: 1000.0          # 按金额模式目标：1000 USDC（当前未使用）
      min_exchange_order_qty:
        default: 0.0                    # 可按交易所覆盖最小下单量
  
  # --------------------------------------------------------------------------
  # 7.5 ETH 跨交易所套利
  # --------------------------------------------------------------------------
  "ETH-USDC-PERP":
    enabled: false                  # 🔧 开关：true=启用，false=禁用
    grid_config:
      initial_spread_threshold: 0.02     # 第 1 格触发点：0.05%
      grid_step: 0.03                    # 网格间隔：0.03%
      max_segments: 5                    # 最大格子数：5 格
    quantity_config:
      base_quantity: 0.04                 # 每格数量：0.1 ETH
      quantity_mode: "fixed"             # 按金额模式
      quantity_precision: 2              # 数量精度：2 位小数
      split_order_size: 0.02             # 单笔订单：0.01（拆成 10 笔）
      target_value_usdc: 500.0           # 按金额模式目标：500 USDC
      min_exchange_order_qty:
        default: 0.0                    # 这里按需设置各交易所最小下单量
